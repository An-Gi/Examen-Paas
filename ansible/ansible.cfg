# Configuración de Ansible — Estudiante A
# Ejecutar los comandos desde ansible/ para que se lea este archivo.
[defaults]
inventory = ./inventories/aws.ini
roles_path = ./roles
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# La EC2 se recrea con terraform y cambia su llave de host: se desactiva la verificación.
# Riesgo aceptado y documentado (solo para este examen).
host_key_checking = False

[ssh_connection]
pipelining = True
