# /etc/apache2/sites-available/wordpress-http.conf — web01 · Estudiante B (Fase 1)
# Web server SIN cifrado (lo pide la rúbrica): no se redirige a HTTPS.
# Apache no acepta comentarios al final de una directiva: siempre en línea aparte.
<VirtualHost *:80>
    ServerName web01.paas.internal
    ServerAlias www.paas.internal
    # Acceso público (Fase 5): Nginx en la EC2 termina TLS y llega aquí por la VPN (10.8.0.20)
    # con "Host: cms.examenpaas.tech" y "X-Forwarded-Proto: https".
    ServerAlias cms.examenpaas.tech

    DocumentRoot /var/www/wordpress

    <Directory /var/www/wordpress>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # wp-config.php nunca se sirve, aunque PHP fallara y Apache lo tratara como texto
    <Files wp-config.php>
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/wordpress-error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress-access.log combined
</VirtualHost>
