# /etc/apache2/sites-available/wordpress-https.conf — web01 · Estudiante B (Fase 1)
# Web server CON cifrado, usando el certificado firmado por nuestra CA (ca/).
# Requiere: a2enmod ssl rewrite headers
<VirtualHost *:443>
    ServerName web01.paas.internal
    ServerAlias www.paas.internal

    DocumentRoot /var/www/wordpress

    SSLEngine on
    SSLCertificateFile    /etc/ssl/paas/web01.crt
    SSLCertificateKeyFile /etc/ssl/private/web01.key
    # TODO(B): ¿protocolos mínimos? p. ej. SSLProtocol -all +TLSv1.2 +TLSv1.3 (explicarlo en la defensa)

    <Directory /var/www/wordpress>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wordpress-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress-ssl-access.log combined
</VirtualHost>
