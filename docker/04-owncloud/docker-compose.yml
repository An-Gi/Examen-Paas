# Servicio 4/6 · OwnCloud — Responsable: Estudiante B (Fase 3)
# Demo:  http://cloud.paas.internal:8080 → login → subir un archivo → descargarlo desde otra VM
#        (por WebDAV: curl -u USUARIO -T archivo http://cloud.paas.internal:8080/remote.php/webdav/)
# MariaDB y Redis son auxiliares de este servicio: no cuentan aparte (pregunta #2).
# Imágenes con arm64 y versión fija (ADR-0002): nada de "latest" en la defensa.
services:
  owncloud:
    image: owncloud/server:10.16.8
    container_name: owncloud
    restart: unless-stopped
    depends_on:
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      OWNCLOUD_DOMAIN: cloud.${DOMINIO_LAN:-paas.internal}:8080
      # Nombres con los que se puede abrir; cualquier otro Host recibe "dominio no confiable"
      OWNCLOUD_TRUSTED_DOMAINS: cloud.${DOMINIO_LAN:-paas.internal},docker01.${DOMINIO_LAN:-paas.internal},${IP_DOCKER01:-10.10.10.30}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: ${OWNCLOUD_DB_PASSWORD:?definir en docker/.env}
      OWNCLOUD_DB_HOST: mariadb
      OWNCLOUD_ADMIN_USERNAME: ${OWNCLOUD_ADMIN_USER:-admin}
      OWNCLOUD_ADMIN_PASSWORD: ${OWNCLOUD_ADMIN_PASSWORD:?definir en docker/.env}
      OWNCLOUD_MYSQL_UTF8MB4: "true"
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
      TZ: ${TZ:-America/Costa_Rica}
    ports:
      - "${IP_DOCKER01:-10.10.10.30}:8080:8080"
    volumes:
      - owncloud_files:/mnt/data
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mariadb:
    image: mariadb:10.11.19   # LTS soportada por OwnCloud 10
    container_name: owncloud_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${OWNCLOUD_DB_ROOT_PASSWORD:?definir en docker/.env}
      MARIADB_DATABASE: owncloud
      MARIADB_USER: owncloud
      MARIADB_PASSWORD: ${OWNCLOUD_DB_PASSWORD:?definir en docker/.env}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ:-America/Costa_Rica}
    # Buffer de InnoDB acotado: docker01 comparte ~3 GB con los servicios de A (ver db01, F1)
    command: ["--max-allowed-packet=128M", "--innodb-log-file-size=64M", "--innodb-buffer-pool-size=128M"]
    volumes:
      - owncloud_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.7   # caché y bloqueo de archivos de OwnCloud
    container_name: owncloud_redis
    restart: unless-stopped
    command: ["--databases", "1", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - owncloud_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Sin puertos publicados para MariaDB ni Redis: solo los ve OwnCloud, por la red interna del proyecto.
volumes:
  owncloud_files:
  owncloud_mysql:
  owncloud_redis:
