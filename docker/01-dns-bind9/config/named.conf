// BIND9 — zona interna paas.internal · Estudiante A (Fase 3)
// Validar antes de levantar (desde docker/01-dns-bind9):
//   docker run --rm -v "$PWD/config:/etc/bind:ro" --entrypoint named-checkconf ubuntu/bind9:9.20-26.04 -z

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };

    // LAN, clientes VPN y red interna de Docker (las consultas desde el propio host llegan por ahí)
    allow-query     { 10.10.10.0/24; 10.8.0.0/24; 172.16.0.0/12; 127.0.0.1; };
    recursion yes;
    allow-recursion { 10.10.10.0/24; 10.8.0.0/24; 172.16.0.0/12; 127.0.0.1; };
    forwarders { 1.1.1.1; 8.8.8.8; };

    dnssec-validation auto;
    // Sin servidor secundario, nadie necesita copiar la zona entera (AXFR). Si se permitiera,
    // cualquiera en la LAN o en la VPN podría listar todos los nombres y las IPs de la red.
    allow-transfer { none; };
};

zone "paas.internal" {
    type primary;
    file "/etc/bind/db.paas.internal";
};

zone "10.10.10.in-addr.arpa" {
    type primary;
    file "/etc/bind/db.10.10.10";
};
