# Servicio 6/6 · FileServer SMB (Samba) — Responsable: Estudiante B (Fase 3)
# Demo (desde db01 o web01):
#   sudo apt install -y cifs-utils && sudo mkdir -p /mnt/smb
#   sudo mount -t cifs //10.10.10.30/compartido /mnt/smb -o username=USUARIO,vers=3.0
#   echo hola | sudo tee /mnt/smb/prueba.txt && ls -l /mnt/smb
services:
  samba:
    image: dockurr/samba:latest   # TODO(B): fijar versión y confirmar los nombres de las variables
    container_name: samba
    restart: unless-stopped
    environment:
      NAME: compartido
      USER: ${SMB_USER:?definir en docker/.env}
      PASS: ${SMB_PASSWORD:?definir en docker/.env}
    ports:
      - "${IP_DOCKER01:-10.10.10.30}:445:445"
    volumes:
      - smb_data:/storage

volumes:
  smb_data:
