# Servicio 6/6 · FileServer SMB (Samba) — Responsable: Estudiante B (Fase 3)
# Demo ("punto de montaje en un cliente Linux", desde web01 o db01):
#   bash ~/paas/docker/probar-montajes.sh smb
# SMB 2/3 va todo por TCP 445 (SMB directo sobre TCP). El 139 (NetBIOS) es de SMB1 y no se publica.
services:
  samba:
    image: dockurr/samba:4.23.10
    container_name: samba
    restart: unless-stopped
    environment:
      NAME: compartido                       # nombre del recurso: //10.10.10.30/compartido
      USER: ${SMB_USER:?definir en docker/.env}
      PASS: ${SMB_PASSWORD:?definir en docker/.env}
      UID: "1000"
      GID: "1000"
      RW: "true"
      TZ: ${TZ:-America/Costa_Rica}
    ports:
      - "${IP_DOCKER01:-10.10.10.30}:445:445"
    volumes:
      - smb_data:/shared

volumes:
  smb_data:
