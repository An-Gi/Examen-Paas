# dhcpd de respaldo — rango reservado en docs/convenciones.md (nunca usar estas IPs como fijas)
authoritative;
default-lease-time 600;
max-lease-time 7200;

subnet 10.10.10.0 netmask 255.255.255.0 {
  range 10.10.10.100 10.10.10.150;
  option domain-name "paas.internal";
  option domain-name-servers 10.10.10.30;
  # Sin "option routers": la salida a Internet de las VMs es por el adaptador NAT.
}
