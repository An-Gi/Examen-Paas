# Servicio de RESPALDO · DHCP (dhcpd) — Responsable: Estudiante B
# Solo se activa si alguno de los 6 servicios falla. Está bajo el perfil "respaldo",
# así que un `up` normal NO lo levanta:
#   docker compose --env-file ../.env --profile respaldo up -d
# Requiere network_mode: host (DHCP usa broadcast en la capa 2) y que VirtualBox no tenga
# su propio DHCP en la red host-only (en Linux preparar-red-virtualbox.sh lo apaga).
# Demo: una VM nueva con su NIC de la LAN en DHCP recibe una IP del rango 10.10.10.100-150.
# En la anfitriona Mac (ADR-0002) vmnet también sirve DHCP, pero en .2-.9: no se pisan los rangos.
services:
  dhcpd:
    image: networkboot/dhcpd:latest   # TODO(B): fijar versión
    container_name: dhcpd
    profiles: ["respaldo"]
    network_mode: host
    restart: "no"
    command: ["${LAN_IFACE:-enp0s9}"]   # NIC de la LAN de docker01 (enp0s9 en ARM)
    volumes:
      - ./data:/data
