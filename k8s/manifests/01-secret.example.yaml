# Copiar a 01-secret.yaml (ignorado por Git) y cambiar los valores.
# stringData evita codificar en base64 a mano. Recordar: base64 NO es cifrado.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db
  namespace: cms
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: cambiar
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wp
  MYSQL_PASSWORD: cambiar
