# Ingress del CMS (Traefik, incluido en k3s) — Estudiante B (Fase 4)
# Nombre: cms-k8s.paas.internal -> 10.10.10.40 (BIND9 de A cuando esté; mientras, /etc/hosts).
# Traefik (Ingress Controller de k3s) escucha en el 80 del nodo y enruta por el encabezado Host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: cms
spec:
  ingressClassName: traefik
  rules:
    - host: cms-k8s.paas.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
  # TODO(B): opcional, tls con un certificado de nuestra CA (Secret tipo kubernetes.io/tls)
